services:

  frontend:

    build:
      context: .
      dockerfile: docker/frontend/Dockerfile

    container_name: AppVIOL_frontend

    working_dir: /app

    volumes:
      - .:/app

    ports:
      - "5173:5173"

    stdin_open: true

    tty: true

    depends_on:
      - backend

    networks:
      - violapp_network

  backend:
    build: 
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: AppVIOL_backend

    working_dir: /app

    volumes:
      - .:/app

    ports:
      - "8080:8080"

    stdin_open: true

    tty: true

    command: sleep infinity

    networks:
      - violapp_network

networks:
  violapp_network:
    driver: bridge