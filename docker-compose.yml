services:

  frontend:

    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile

    container_name: AppVIOL_frontend

    working_dir: /app

    volumes:
      - ./frontend:/app

    ports:
      - "5173:5173"

    stdin_open: true

    tty: true

    depends_on:
      - backend

    networks:
      - violapp_network

  backend:
    build: 
      context: .
      dockerfile: ./docker/backend/Dockerfile

    container_name: AppVIOL_backend

    working_dir: /app

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    stdin_open: true

    tty: true

    networks:
      - violapp_network

networks:
  violapp_network:
    driver: bridge